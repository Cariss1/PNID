name: CI Assessment Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Додаємо глобальну змінну для вирішення проблем з Node.js
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Щоб ми бачили результати для ВСІХ версій Python, навіть якщо одна впаде
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Залишаємо v4, але env вище змусить її працювати на Node 24

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5 # Оновили до v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-html
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        # Перевіряємо тільки папку app та tests
        flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest and generate report
      # Додаємо PYTHONPATH, щоб Python бачив вашу папку app
      env:
        PYTHONPATH: .
      run: |
        pytest --html=report.html --self-contained-html

    - name: Upload HTML report
      if: always() # Звіт створиться навіть якщо тести впали
      uses: actions/upload-artifact@v4
      with:
        name: pytest-report-${{ matrix.python-version }}
        path: report.html

  build-docker:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build Docker image
      run: |
        docker build -t my-app-image:latest .
